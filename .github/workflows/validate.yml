name: Validate

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: bash -n install.sh
      - run: bash -n scripts/install-nova-agent.sh
      - name: Smoke test Nova Agent
        run: |
          mkdir -p "$RUNNER_TEMP/nova-agent-state"
          NOVA_AGENT_TOKEN=test-token NOVA_AGENT_STATE_DIR="$RUNNER_TEMP/nova-agent-state" NOVA_AGENT_PORT=19443 node dist/nova-agent.cjs >"$RUNNER_TEMP/nova-agent.log" 2>&1 &
          AGENT_PID=$!
          trap 'kill "$AGENT_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS -H "Authorization: Bearer test-token" http://127.0.0.1:19443/v1/health; then
              exit 0
            fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/nova-agent.log"
          exit 1
